<style>

.shell{display:flex}
.sidebar{width:210px;flex:none;background:#fff;border-right:1px solid var(--border);min-height:820px;padding:18px 0}
.sidebar a{display:block;padding:9px 22px;font-size:13.5px;color:var(--ink-muted);text-decoration:none;font-weight:600}

.tabnav{display:flex;border-bottom:1px solid var(--border);margin-bottom:22px}
.tabnav a{padding:11px 4px;margin-right:24px;font-size:13.5px;font-weight:600;color:var(--ink-muted);border-bottom:2px solid transparent;text-decoration:none}
.tabnav a.active{color:var(--ink);border-bottom-color:var(--accent)}
.field{margin-bottom:16px;max-width:380px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field input,.field select{width:100%;font:inherit;font-size:15px;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-sm)}
.field input[readonly]{background:var(--surface-sunken);color:var(--ink-muted)}
.btn{font-family:var(--font-sans);font-weight:600;font-size:13.5px;padding:9px 16px;border-radius:var(--radius-sm);border:none;cursor:pointer;background:var(--accent);color:#fff;margin-top:8px}
.btn-danger{background:#fff;border:1px solid var(--danger-ink);color:var(--danger-ink);margin-left:8px}
