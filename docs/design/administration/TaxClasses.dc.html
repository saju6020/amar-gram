:root{--surface-page:#F7F4EC;--surface:#fff;--surface-sunken:#F0E9DA;--ink:#2A1F12;--ink-muted:#69553C;--border:#E5DCC8;--border-strong:#CDBB99;--accent:#B4531A;--accent-ink:#8A3D11;--accent-soft:rgba(180,83,26,.08);--font-display:"Fraunces",Georgia,serif;--font-sans:"Work Sans",system-ui,sans-serif;--radius-sm:6px;--radius-md:10px;--radius-pill:999px}

body{margin:0;font-family:var(--font-sans);background:var(--surface-page);color:var(--ink)}
.topnav{display:flex;align-items:center;justify-content:space-between;padding:12px 28px;border-bottom:1px solid var(--border);background:#fff}

th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);font-size:13.5px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-muted);background:var(--surface-sunken)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface-sunken);cursor:pointer}
.h2{font-weight:700;font-size:14px;margin:0 0 10px}
.hrow{display:flex;align-items:center;gap:12px;padding:9px 12px;border:1px solid var(--border);border-radius:6px;margin-bottom:6px;font-size:13.5px}
.badge{display:inline-flex;padding:3px 9px;border-radius:var(--radius-pill);font-size:11.5px;font-weight:600;background:var(--accent-soft);color:var(--accent-ink)}
.badge-past{background:var(--surface-sunken);color:var(--ink-muted)}
