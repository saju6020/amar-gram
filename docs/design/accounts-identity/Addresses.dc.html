<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Account — Addresses — US-ACC-06</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--surface-page:#F7F4EC;--surface:#fff;--surface-sunken:#F0E9DA;--ink:#2A1F12;--ink-muted:#69553C;--border:#E5DCC8;--border-strong:#CDBB99;--accent:#B4531A;--accent-ink:#8A3D11;--accent-soft:rgba(180,83,26,.08);--font-display:"Fraunces",Georgia,serif;--font-sans:"Work Sans",system-ui,sans-serif;--radius-sm:6px;--radius-md:10px;--radius-pill:999px}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-sans);background:var(--surface-page);color:var(--ink)}
.topnav{display:flex;align-items:center;justify-content:space-between;padding:14px 32px;border-bottom:1px solid var(--border);background:#fff}
.brand{font-family:var(--font-display);font-weight:600;font-size:18px;color:var(--accent-ink)}
.who{display:flex;align-items:center;gap:14px;font-size:13.5px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.tabnav{display:flex;border-bottom:1px solid var(--border);padding:0 32px;background:#fff}
.tab{padding:14px 4px;margin-right:26px;font-size:14px;font-weight:600;color:var(--ink-muted);border-bottom:2px solid transparent}
.tab.active{color:var(--ink);border-bottom-color:var(--accent)}
.h1{font-family:var(--font-display);font-weight:600;font-size:22px;margin:0}
.muted{color:var(--ink-muted)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:var(--radius-pill);font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent-ink)}
.acard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:18px 20px;margin-bottom:14px}
.acard-hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.actions{display:flex;gap:14px}
.link-btn{background:none;border:none;color:var(--accent-ink);font-weight:600;font-size:13px;cursor:pointer;padding:0}
.link-btn.danger{color:#8A2814}
.hint-box{display:flex;gap:8px;background:var(--surface-sunken);border-radius:var(--radius-sm);padding:12px 14px;font-size:13px;color:var(--ink-muted);margin-top:16px;max-width:640px}
</style>
</helmet>
<div style="width:1280px;height:900px;background:var(--surface-page);overflow:auto">
  <div class="topnav"><div class="brand">Amar Gram</div><div class="who"><div class="avatar">FY</div>Farhana Yasmin <a href="#" style="color:var(--accent-ink);font-weight:600;margin-left:8px">Sign out</a></div></div>
  <div class="tabnav">
    <div class="tab">Profile</div>
    <div class="tab active" aria-current="page">Addresses</div>
    <div class="tab">Notifications</div>
    <div class="tab">Your data</div>
  </div>
  <div style="max-width:720px;margin:0 auto;padding:36px 32px">
    <h1 class="h1" style="margin-bottom:20px">Addresses</h1>

    <div class="acard">
      <div class="acard-hd">
        <div>
          <div style="font-weight:700">Home <span class="badge" style="margin-left:8px">Default</span></div>
          <div class="muted" style="margin-top:4px;font-size:14px;line-height:1.5">House 12, Road 6, Banani<br>Dhaka 1213</div>
        </div>
        <div class="actions"><button type="button" class="link-btn">Edit</button></div>
      </div>
    </div>

    <div class="acard">
      <div class="acard-hd">
        <div>
          <div style="font-weight:700">Outlet pickup</div>
          <div class="muted" style="margin-top:4px;font-size:14px;line-height:1.5">c/o Amar Gram Uttara outlet<br>Sector 7, Uttara, Dhaka</div>
        </div>
        <div class="actions">
          <button type="button" class="link-btn">Set as default</button>
          <button type="button" class="link-btn">Edit</button>
          <button type="button" class="link-btn danger">Remove</button>
        </div>
      </div>
    </div>

    <button type="button" class="link-btn" style="font-size:14px">+ Add an address</button>

    <div class="hint-box" role="status">
      <span aria-hidden="true">ⓘ</span>
      <span>Removing "Home" would leave "Outlet pickup" without a default — pick a new default first.</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic { renderVals(){ return {}; } }
</script>
</body>
</html>
